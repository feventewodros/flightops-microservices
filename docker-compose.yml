services:
  flight-service:
    build:
      context: .
      dockerfile: flight-service/Dockerfile
    ports:
      - "8082:8082"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8084:8084"

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    environment:
      FLIGHT_SERVICE_URL: http://flight-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - flight-service
      - notification-service
    ports:
      - "8083:8083"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      FLIGHT_SERVICE_URL: http://flight-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - flight-service
      - booking-service
      - notification-service
    ports:
      - "8080:8080"
