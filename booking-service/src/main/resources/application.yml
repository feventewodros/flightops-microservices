server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookings;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

# URLs of the services this one depends on (overridden by env vars in Docker Compose).
services:
  flight-url: ${FLIGHT_SERVICE_URL:http://localhost:8082}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
